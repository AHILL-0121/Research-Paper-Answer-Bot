<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Research Paper Answer Bot architecture</title>
  <desc id="desc">Offline ingestion builds a Chroma vector index and a BM25 index from 11 papers. Each question is optionally rewritten from chat history, searched with hybrid dense and BM25 retrieval, reranked to the top 3, checked for weak context with an optional web fallback, answered by llama3.1 through Ollama, and returned with 3 sources built from chunk metadata. The notebook, the Streamlit app and the FastAPI service with its Next.js app all use the same pipeline.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4A505C"/>
    </marker>
    <marker id="arrow-web" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1C6E54"/>
    </marker>
    <style>
      text { font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; fill: #1A1D24; }
      .h1 { font: 600 22px "Source Serif 4", Georgia, serif; }
      .sub { font-size: 13px; fill: #4A505C; }
      .band { fill: #F2F3F6; stroke: #E8EAEE; }
      .band-label { font: 500 11px "IBM Plex Mono", Consolas, monospace; letter-spacing: .08em; fill: #636A79; }
      .box { fill: #FFFFFF; stroke: #C9CCD3; stroke-width: 1.2; }
      .store { fill: #FFFFFF; stroke: #2F3C9E; stroke-width: 1.2; }
      .key { fill: #E7E9F7; stroke: #2F3C9E; stroke-width: 1.4; }
      .web { fill: #E3F2EC; stroke: #1C6E54; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .opt { fill: #FFFFFF; stroke: #2F3C9E; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .t { font-size: 14px; font-weight: 600; }
      .d { font-size: 12px; fill: #4A505C; }
      .m { font: 11.5px "IBM Plex Mono", Consolas, monospace; fill: #636A79; }
      .tag { font: 600 10.5px "IBM Plex Mono", Consolas, monospace; fill: #2F3C9E; letter-spacing: .04em; }
      .tag-web { font: 600 10.5px "IBM Plex Mono", Consolas, monospace; fill: #1C6E54; letter-spacing: .04em; }
      .line { fill: none; stroke: #4A505C; stroke-width: 1.4; }
      .line-web { fill: none; stroke: #1C6E54; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .edge { font-size: 11.5px; fill: #4A505C; }
      .edge-web { font-size: 11.5px; fill: #1C6E54; }
    </style>
  </defs>

  <rect width="1240" height="900" fill="#FFFFFF"/>
  <text class="h1" x="40" y="44">Research Paper Answer Bot: architecture</text>
  <text class="sub" x="40" y="66">Grounded answers from 11 GenAI papers, each with the 3 passages it was written from. Dashed boxes are optional stretch stages.</text>

  <!-- ===== Band 1: offline ingestion ===== -->
  <rect class="band" x="20" y="86" width="1200" height="196" rx="10"/>
  <text class="band-label" x="40" y="108">OFFLINE · INGESTION (scripts/ingest.py)</text>

  <rect class="box" x="40" y="124" width="170" height="78" rx="6"/>
  <text class="t" x="54" y="148">11 arXiv PDFs</text>
  <text class="d" x="54" y="167">411 pages, from</text>
  <text class="m" x="54" y="186">data/pdfs/</text>

  <rect class="box" x="250" y="124" width="200" height="78" rx="6"/>
  <text class="t" x="264" y="148">Load and clean</text>
  <text class="d" x="264" y="167">PyPDF, page by page; headers,</text>
  <text class="d" x="264" y="184">hyphens and whitespace fixed</text>

  <rect class="box" x="490" y="124" width="210" height="78" rx="6"/>
  <text class="t" x="504" y="148">Chunk</text>
  <text class="d" x="504" y="167">512 tokens, no overlap, references</text>
  <text class="d" x="504" y="184">dropped: 766 chunks + metadata</text>

  <rect class="box" x="740" y="124" width="190" height="78" rx="6"/>
  <text class="t" x="754" y="148">Embed: bge-m3</text>
  <text class="d" x="754" y="167">local, 1024-d, cached;</text>
  <text class="d" x="754" y="184">Gemini kept as alternative</text>

  <rect class="store" x="964" y="124" width="240" height="64" rx="6"/>
  <text class="t" x="984" y="148">ChromaDB (cosine)</text>
  <text class="m" x="984" y="168" style="font-size:10.5px">papers__bge_m3__fixed_512_0_noref</text>

  <rect class="store" x="964" y="200" width="240" height="64" rx="6"/>
  <text class="t" x="984" y="224">BM25 keyword index</text>
  <text class="m" x="984" y="244">bm25.joblib · chunks.parquet</text>

  <path class="line" d="M210 163 H246" marker-end="url(#arrow)"/>
  <path class="line" d="M450 163 H486" marker-end="url(#arrow)"/>
  <path class="line" d="M700 163 H736" marker-end="url(#arrow)"/>
  <path class="line" d="M930 156 H960" marker-end="url(#arrow)"/>
  <path class="line" d="M595 202 V232 H960" marker-end="url(#arrow)"/>

  <!-- ===== Band 2: online query ===== -->
  <rect class="band" x="20" y="300" width="1200" height="372" rx="10"/>
  <text class="band-label" x="40" y="322">ONLINE · EACH QUESTION (rpab.rag + rpab.memory)</text>

  <!-- row 1 -->
  <rect class="box" x="40" y="340" width="150" height="80" rx="6"/>
  <text class="t" x="54" y="366">Question</text>
  <text class="d" x="54" y="385">strategy, paper</text>
  <text class="d" x="54" y="402">filter, session id</text>

  <rect class="opt" x="226" y="340" width="190" height="80" rx="6"/>
  <text class="tag" x="240" y="358">S1 · MEMORY</text>
  <text class="t" x="240" y="377">Rewrite follow-up</text>
  <text class="d" x="240" y="396">into a standalone question</text>
  <text class="d" x="240" y="412">from the last 6 messages</text>

  <rect class="box" x="452" y="340" width="220" height="80" rx="6"/>
  <text class="t" x="466" y="366">Hybrid search</text>
  <text class="d" x="466" y="385">dense top 20 + BM25 top 20,</text>
  <text class="d" x="466" y="402">reciprocal rank fusion</text>

  <rect class="box" x="708" y="340" width="210" height="80" rx="6"/>
  <text class="t" x="722" y="366">Rerank to top 3</text>
  <text class="d" x="722" y="385">cross-encoder</text>
  <text class="m" x="722" y="404">bge-reranker-v2-m3</text>

  <rect class="box" x="954" y="340" width="246" height="80" rx="6"/>
  <text class="t" x="968" y="366">Weak-context check</text>
  <text class="d" x="968" y="385">top rerank score &lt; 0.72</text>
  <text class="d" x="968" y="402">(calibrated on dev questions)</text>

  <path class="line" d="M190 380 H222" marker-end="url(#arrow)"/>
  <path class="line" d="M416 380 H448" marker-end="url(#arrow)"/>
  <path class="line" d="M672 380 H704" marker-end="url(#arrow)"/>
  <path class="line" d="M918 380 H950" marker-end="url(#arrow)"/>
  <!-- indexes feed the hybrid search -->
  <path class="line" d="M1085 264 V284 H562 V336" marker-end="url(#arrow)"/>
  <text class="edge" x="700" y="296">both indexes</text>

  <!-- chat memory store -->
  <rect class="store" x="226" y="446" width="212" height="46" rx="6"/>
  <text class="t" x="240" y="466">chat.db (SQLite)</text>
  <text class="m" x="240" y="483">sessions · messages · sources</text>
  <path class="line" d="M321 446 V424" marker-end="url(#arrow)"/>

  <!-- row 2, right to left -->
  <rect class="web" x="954" y="520" width="246" height="92" rx="6"/>
  <text class="tag-web" x="968" y="540">S3 · CORRECTIVE RAG (opt-in)</text>
  <text class="t" x="968" y="560">Web search: DuckDuckGo</text>
  <text class="d" x="968" y="579">snippets reranked with the papers;</text>
  <text class="d" x="968" y="596">kept only if they score higher</text>

  <rect class="box" x="708" y="520" width="210" height="92" rx="6"/>
  <text class="t" x="722" y="546">Prompt</text>
  <text class="d" x="722" y="565">numbered passages [1]-[3],</text>
  <text class="d" x="722" y="582">cite-or-refuse rules, weak</text>
  <text class="d" x="722" y="599">or web notice when needed</text>

  <rect class="key" x="452" y="520" width="220" height="92" rx="6"/>
  <text class="t" x="466" y="546">llama3.1 8B via Ollama</text>
  <text class="d" x="466" y="565">local GPU, temperature 0,</text>
  <text class="d" x="466" y="582">8k context, streamed tokens</text>
  <text class="m" x="466" y="601">CPU profile: llama3.2 3B</text>

  <rect class="box" x="226" y="520" width="190" height="92" rx="6"/>
  <text class="t" x="240" y="546">Guard the answer</text>
  <text class="d" x="240" y="565">drop citations to missing</text>
  <text class="d" x="240" y="582">passages; normalise refusal</text>
  <text class="d" x="240" y="599">to the exact sentence</text>

  <rect class="key" x="40" y="520" width="150" height="92" rx="6"/>
  <text class="t" x="54" y="546">Answer +</text>
  <text class="t" x="54" y="565">3 sources</text>
  <text class="d" x="54" y="584">title and page from</text>
  <text class="d" x="54" y="601">chunk metadata</text>

  <path class="line-web" d="M1077 420 V516" marker-end="url(#arrow-web)"/>
  <text class="edge-web" x="1084" y="476">weak and</text>
  <text class="edge-web" x="1084" y="491">fallback on</text>
  <path class="line" d="M990 420 V470 H813 V516" marker-end="url(#arrow)"/>
  <text class="edge" x="826" y="462">otherwise</text>
  <path class="line-web" d="M954 566 H922" marker-end="url(#arrow-web)"/>
  <path class="line" d="M708 566 H676" marker-end="url(#arrow)"/>
  <path class="line" d="M452 566 H420" marker-end="url(#arrow)"/>
  <path class="line" d="M226 566 H194" marker-end="url(#arrow)"/>
  <!-- the turn is saved -->
  <path class="line" d="M115 520 V469 H222" marker-end="url(#arrow)"/>
  <text class="edge" x="124" y="462">saved</text>
  <text class="d" x="40" y="648">A refusal still returns the 3 closest passages. Sources are never parsed from the model's text, so citations cannot be invented.</text>

  <!-- ===== Band 3: apps ===== -->
  <rect class="band" x="20" y="690" width="1200" height="190" rx="10"/>
  <text class="band-label" x="40" y="712">USE IT FROM</text>

  <rect class="box" x="40" y="730" width="250" height="96" rx="6"/>
  <text class="t" x="54" y="756">Capstone notebook</text>
  <text class="d" x="54" y="775">experiments, evaluation,</text>
  <text class="d" x="54" y="792">demo queries</text>
  <text class="m" x="54" y="812">notebooks/capstone.ipynb</text>

  <rect class="box" x="330" y="730" width="250" height="96" rx="6"/>
  <text class="tag" x="344" y="748">S2 · UI</text>
  <text class="t" x="344" y="767">Streamlit app</text>
  <text class="d" x="344" y="786">pipeline in-process, streamed</text>
  <text class="m" x="344" y="812">frontend/streamlit · :8501</text>

  <rect class="box" x="660" y="730" width="250" height="96" rx="6"/>
  <text class="t" x="674" y="756">FastAPI service</text>
  <text class="d" x="674" y="775">/ask, /ask/stream (SSE),</text>
  <text class="d" x="674" y="792">/papers, /sessions, /health</text>
  <text class="m" x="674" y="812">backend/api · :8000</text>

  <rect class="box" x="950" y="730" width="250" height="96" rx="6"/>
  <text class="t" x="964" y="756">Next.js app</text>
  <text class="d" x="964" y="775">TypeScript, Tailwind;</text>
  <text class="d" x="964" y="792">reader, sessions, themes</text>
  <text class="m" x="964" y="812">frontend/web · :3000</text>

  <path class="line" d="M910 778 H946" marker-end="url(#arrow)"/>
  <text class="edge" x="915" y="770">HTTP</text>
  <path class="line" d="M165 676 V726" marker-end="url(#arrow)"/>
  <path class="line" d="M455 676 V726" marker-end="url(#arrow)"/>
  <path class="line" d="M785 676 V726" marker-end="url(#arrow)"/>
  <text class="d" x="40" y="860">All three entry points call the same pipeline and the same Pydantic models (rpab.schemas); run one model-loading app at a time on an 8 GB GPU.</text>
</svg>
